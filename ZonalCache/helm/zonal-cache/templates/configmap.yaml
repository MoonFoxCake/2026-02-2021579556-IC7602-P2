apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zc.fullname" . }}-env
  labels: {{- include "zc.labels" . | nindent 4 }}
data:
  ZC_ZONE: {{ .Values.zone | quote }}
  {{- if .Values.config.file }}
  ZC_CONFIG_FILE: {{ .Values.config.file | quote }}
  {{- else }}
  ZC_CONFIG_URL: {{ required "config.url es obligatorio (o config.file)" .Values.config.url | quote }}
  {{- end }}
  ZC_CONFIG_REFRESH_SECS: {{ .Values.config.refreshSecs | quote }}
  ZC_LOGIN_MODE: {{ .Values.login.mode | quote }}
  ZC_LOGIN_UI_URL: {{ .Values.login.uiUrl | quote }}
  ZC_SESSION_TTL_SECS: {{ .Values.login.sessionTtlSecs | quote }}
  ZC_LOGIN_MAX_ATTEMPTS: {{ .Values.login.maxAttempts | quote }}
  ZC_LOGIN_WINDOW_SECS: {{ .Values.login.windowSecs | quote }}
  ZC_COOKIE_SECURE: {{ .Values.login.cookieSecure | quote }}
  ZC_CACHE_DIR: /var/cache/zc
  ZC_HTTP_PORT: "8080"
  ZC_HTTPS_PORT: "8443"
  {{- if .Values.tls.enabled }}
  ZC_TLS_CERT_FILE: /etc/zc/tls/tls.crt
  ZC_TLS_KEY_FILE: /etc/zc/tls/tls.key
  {{- if .Values.tls.sniSecretName }}
  ZC_TLS_CERT_DIR: /etc/zc/sni
  {{- end }}
  {{- end }}
{{- if .Values.config.file }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zc.fullname" . }}-config
  labels: {{- include "zc.labels" . | nindent 4 }}
data:
  config.json: {{ .Values.config.configFileContent | quote }}
{{- end }}
