apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zc.fullname" . }}
  labels: {{- include "zc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: { type: Recreate }      # el PVC es ReadWriteOnce
  selector:
    matchLabels: {{- include "zc.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "zc.labels" . | nindent 8 }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: zonal-cache
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: {{ include "zc.fullname" . }}-env }
            - secretRef: { name: {{ .Values.existingSecret }}, optional: true }
          ports:
            - { name: http, containerPort: 8080 }
            {{- if .Values.tls.enabled }}
            - { name: https, containerPort: 8443 }
            {{- end }}
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: /var/cache/zc }
            {{- if .Values.config.file }}
            - { name: config, mountPath: {{ dir .Values.config.file }}, readOnly: true }
            {{- end }}
            {{- if .Values.tls.enabled }}
            - { name: tls, mountPath: /etc/zc/tls, readOnly: true }
            {{- if .Values.tls.sniSecretName }}
            - { name: sni, mountPath: /etc/zc/sni, readOnly: true }
            {{- end }}
            {{- end }}
      volumes:
        - name: cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "zc.fullname" . }}-cache }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.config.file }}
        - name: config
          configMap: { name: {{ include "zc.fullname" . }}-config, items: [ { key: config.json, path: {{ base .Values.config.file }} } ] }
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret: { secretName: {{ .Values.tls.secretName }} }
        {{- if .Values.tls.sniSecretName }}
        - name: sni
          secret: { secretName: {{ .Values.tls.sniSecretName }} }
        {{- end }}
        {{- end }}
