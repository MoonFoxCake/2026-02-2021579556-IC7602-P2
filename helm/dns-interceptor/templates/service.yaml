apiVersion: v1
kind: Service
metadata:
  name: {{ include "dns.fullname" . }}
  labels: {{- include "dns.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "dns.labels" . | nindent 4 }}
  ports:
    - name: dns
      port: {{ .Values.service.port }}
      targetPort: dns
      protocol: UDP
