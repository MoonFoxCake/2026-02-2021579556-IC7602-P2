apiVersion: v1
kind: ConfigMap
metadata:
  name: public-cache-config
data:
  config.yml: |
    tunnel: {{ required "Set tunnelId" .Values.tunnelId }}
    credentials-file: /etc/tunnel/tunnel.json
    metrics: 0.0.0.0:2000
    protocol: http2
    loglevel: warn
    ingress:
      - hostname: redes-cr.{{ required "Set baseDomain" .Values.baseDomain }}
        service: https://zc-cr.{{ .Release.Namespace }}.svc.cluster.local:443
        originRequest:
          originServerName: {{ required "Set originServerName" .Values.originServerName }}
          caPool: /etc/cache-ca/tls.crt
      - hostname: redes-us.{{ .Values.baseDomain }}
        service: https://zc-us.{{ .Release.Namespace }}.svc.cluster.local:443
        originRequest:
          originServerName: {{ .Values.originServerName }}
          caPool: /etc/cache-ca/tls.crt
      - hostname: redes-panel-cr.{{ .Values.baseDomain }}
        service: http://127.0.0.1:8080
      - hostname: redes-panel-us.{{ .Values.baseDomain }}
        service: http://127.0.0.1:8080
      - service: http_status:404
