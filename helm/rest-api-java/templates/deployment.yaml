apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "java.fullname" . }}
  labels: {{- include "java.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "java.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "java.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: rest-api-java
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
